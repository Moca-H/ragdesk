services:
  api:
    build:
      context: ./apps/api
    volumes:
      - ragdesk-data:/app/data
    # Put secrets/models in .env (see .env.example). Empty strings are omitted
    # so API defaults still apply when a key is unset.
    environment:
      RAGDESK_PROVIDER: ${RAGDESK_PROVIDER:-mock}
      RAGDESK_BASE_URL: ${RAGDESK_BASE_URL:-}
      RAGDESK_API_KEY: ${RAGDESK_API_KEY:-}
      RAGDESK_CHAT_MODEL: ${RAGDESK_CHAT_MODEL:-gpt-4o-mini}
      RAGDESK_EMBEDDING_MODEL: ${RAGDESK_EMBEDDING_MODEL:-text-embedding-3-small}
      RAGDESK_OLLAMA_BASE_URL: ${RAGDESK_OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      RAGDESK_API_TOKEN: ${RAGDESK_API_TOKEN:-}
      RAGDESK_LOCK_SETTINGS: ${RAGDESK_LOCK_SETTINGS:-}
      RAGDESK_CORS_ORIGINS: ${RAGDESK_CORS_ORIGINS:-}
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "${RAGDESK_HTTP_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ragdesk-data:
