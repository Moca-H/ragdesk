[project]
name = "ragdesk-mcp"
version = "0.1.0"
description = "MCP server for ragdesk — list KBs, ingest text, and ask your local RAG API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moca-H" }]
keywords = ["mcp", "rag", "ragdesk", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.6.0,<2",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Moca-H/ragdesk"
Repository = "https://github.com/Moca-H/ragdesk"
Issues = "https://github.com/Moca-H/ragdesk/issues"

[project.scripts]
ragdesk-mcp = "ragdesk_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdesk_mcp"]
